<html>
  <head>
    <link rel="stylesheet" href="/mod/_core/visual/index.css" />
    <link rel="stylesheet" href="/mod/_core/onscreen_agent/onscreen-agent.css" />
    <link rel="stylesheet" href="/mod/_core/onscreen_agent/response-markdown.css" />
    <link rel="stylesheet" href="/mod/_core/huggingface/huggingface.css" />
    <script type="module" src="/mod/_core/onscreen_agent/store.js"></script>
  </head>
  <body>
    <div x-data class="onscreen-agent-root agent-thread-surface" x-init="$nextTick(() => $store.onscreenAgent.init())">
      <x-context data-tags="onscreen"></x-context>
      <template x-if="$store.onscreenAgent && $store.onscreenAgent.shouldRenderShell">
        <section
          class="onscreen-agent-shell"
          :class="{
            'is-compact': $store.onscreenAgent.isCompactMode,
            'is-dragging': $store.onscreenAgent.isDraggingAgent,
            'is-edge-hidden': $store.onscreenAgent.isEdgeHidden,
            'is-edge-hidden-bottom': $store.onscreenAgent.hiddenEdge === 'bottom',
            'is-edge-hidden-left': $store.onscreenAgent.hiddenEdge === 'left',
            'is-edge-hidden-right': $store.onscreenAgent.hiddenEdge === 'right',
            'is-edge-hidden-top': $store.onscreenAgent.hiddenEdge === 'top',
            'is-full': $store.onscreenAgent.isFullMode,
            'is-history-below': $store.onscreenAgent.isHistoryBelow,
            'is-mode-collapsing': $store.onscreenAgent.isModeTransitionCollapsing,
            'is-mode-expanding': $store.onscreenAgent.isModeTransitionExpanding,
            'is-right': $store.onscreenAgent.isDockedRight
          }"
          x-ref="shell"
          x-cloak
          :style="$store.onscreenAgent.positionStyle"
          @pointerdown.capture="$store.onscreenAgent.handleShellPointerDown($event)"
          @dragend.window="$store.onscreenAgent.resetAttachmentDragState()"
          @drop.window="$store.onscreenAgent.resetAttachmentDragState()"
          x-init="$nextTick(() => $store.onscreenAgent.mount({ actionMenu: $refs.actionMenu, avatar: $refs.avatar, avatarVisual: $refs.avatarVisual, attachmentInput: $refs.attachmentInput, historyDialog: $refs.historyDialog, input: $refs.input, panel: $refs.panel, rawDialog: $refs.rawDialog, scroller: $refs.scroller, settingsDialog: $refs.settingsDialog, shell: $refs.shell, uiBubbleContent: $refs.uiBubbleContent }))"
          x-destroy="$store.onscreenAgent.unmount()"
        >
          <div class="onscreen-agent-cluster" x-ref="avatarVisual">
            <div
              class="onscreen-agent-ui-bubble onscreen-agent-startup-hint-bubble is-visible"
              x-show="$store.onscreenAgent.isStartupHintVisible"
              :class="{
                'is-left': $store.onscreenAgent.isDockedRight,
                'is-right': !$store.onscreenAgent.isDockedRight,
                'is-above': !$store.onscreenAgent.isUiBubbleBelowHead,
                'is-below': $store.onscreenAgent.isUiBubbleBelowHead
              }"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            >
              <div class="onscreen-agent-ui-bubble-text">
                <p><strong>Drag</strong> me, <strong>tap</strong> me.</p>
              </div>
            </div>
            <div
              class="onscreen-agent-ui-bubble"
              x-show="$store.onscreenAgent.isUiBubbleMounted"
              :class="{
                'is-left': $store.onscreenAgent.isDockedRight,
                'is-right': !$store.onscreenAgent.isDockedRight,
                'is-above': !$store.onscreenAgent.isUiBubbleBelowHead,
                'is-below': $store.onscreenAgent.isUiBubbleBelowHead,
                'is-entering': $store.onscreenAgent.uiBubblePhase === 'entering',
                'is-visible': $store.onscreenAgent.uiBubblePhase === 'visible',
                'is-leaving': $store.onscreenAgent.uiBubblePhase === 'leaving',
                'is-clickable': $store.onscreenAgent.isCompactMode
              }"
              :role="$store.onscreenAgent.isCompactMode ? 'button' : 'status'"
              aria-live="polite"
              aria-atomic="true"
              :tabindex="$store.onscreenAgent.isCompactMode ? '0' : '-1'"
              :title="$store.onscreenAgent.isCompactMode ? 'Open full chat' : null"
              @click.prevent.stop="$store.onscreenAgent.handleUiBubbleActivate($event)"
              @keydown.enter.prevent.stop="$store.onscreenAgent.handleUiBubbleActivate($event)"
              @keydown.space.prevent.stop="$store.onscreenAgent.handleUiBubbleActivate($event)"
            >
              <div x-ref="uiBubbleContent"></div>
            </div>
            <button
              type="button"
              class="onscreen-agent-avatar-button"
              x-ref="avatar"
              :aria-label="$store.onscreenAgent.avatarButtonLabel"
              :title="$store.onscreenAgent.avatarButtonLabel"
              @pointerdown="$store.onscreenAgent.handleAgentPointerDown($event)"
              @wheel="$store.onscreenAgent.handleAvatarWheel($event)"
            >
              <span class="onscreen-agent-avatar-orbit">
                <span class="onscreen-agent-avatar-flip">
                  <img
                    class="onscreen-agent-avatar-image"
                    src="/mod/_core/visual/res/chat/overlay/astronaut_no_bg.webp"
                    alt=""
                    aria-hidden="true"
                    draggable="false"
                  />
                </span>
              </span>
            </button>

            <div class="onscreen-agent-body">
              <template x-if="$store.onscreenAgent.isFullMode">
                <div
                  class="onscreen-agent-history-shell"
                  :style="$store.onscreenAgent.historyStyle"
                  x-ref="historyShell"
                  x-show="$store.onscreenAgent.shouldShowHistory"
                  x-init="$nextTick(() => $store.onscreenAgent.mountHistory({ historyShell: $refs.historyShell, scroller: $refs.scroller }))"
                  x-destroy="$store.onscreenAgent.unmountHistory()"
                >
                  <div
                    class="onscreen-agent-history-resize-handle"
                    title="Resize chat history"
                    @pointerdown="$store.onscreenAgent.handleHistoryResizePointerDown($event)"
                  ></div>
                  <div class="onscreen-agent-history" x-ref="scroller" @click="$store.onscreenAgent.handleThreadClick($event)">
                    <div class="chat-thread" x-ignore data-chat-thread></div>
                  </div>
                </div>
              </template>

              <div
                class="onscreen-agent-panel"
                :class="{
                  'is-attachment-drag-active': $store.onscreenAgent.isAttachmentDragActive,
                  'is-compact': $store.onscreenAgent.isCompactMode
                }"
                x-ref="panel"
                @dragenter="$store.onscreenAgent.handleAttachmentDragEnter($event)"
                @dragover="$store.onscreenAgent.handleAttachmentDragOver($event)"
                @dragleave="$store.onscreenAgent.handleAttachmentDragLeave($event)"
                @drop="$store.onscreenAgent.handleAttachmentDrop($event)"
              >
                <form
                  class="onscreen-agent-composer"
                  :class="{ 'is-compact': $store.onscreenAgent.isCompactMode }"
                  @submit.prevent="$store.onscreenAgent.handleComposerSubmitAction()"
                >
                  <input
                    x-ref="attachmentInput"
                    type="file"
                    multiple
                    class="composer-attachment-input"
                    @change="$store.onscreenAgent.handleAttachmentInput($event)"
                  />
                  <div class="onscreen-agent-composer-input-wrap">
                    <textarea
                      x-ref="input"
                      name="message"
                      rows="1"
                      aria-label="Message onscreen agent"
                      :placeholder="$store.onscreenAgent.composerPlaceholder"
                      x-model="$store.onscreenAgent.draft"
                      :disabled="$store.onscreenAgent.isComposerInputDisabled || $store.onscreenAgent.shouldShowApiKeyWarning"
                      @input="$store.onscreenAgent.handleDraftInput($event)"
                      @keydown="$store.onscreenAgent.handleComposerKeydown($event)"
                    ></textarea>
                    <template x-if="$store.onscreenAgent.shouldShowApiKeyWarning">
                      <div class="onscreen-agent-set-api-key-overlay">
                        <button
                          type="button"
                          class="onscreen-agent-set-api-key-button"
                          @click="$store.onscreenAgent.openSettingsDialog()"
                        >
                          Set LLM API key
                        </button>
                      </div>
                    </template>
                  </div>
                  <div class="onscreen-agent-composer-actions">
                    <button
                      type="button"
                      class="onscreen-agent-inline-button onscreen-agent-send-button"
                      :class="{
                        'is-busy': $store.onscreenAgent.isPrimaryActionBusy,
                        'is-stop': $store.onscreenAgent.isPrimaryActionStop
                      }"
                      :disabled="$store.onscreenAgent.isPrimaryActionDisabled"
                      :aria-label="$store.onscreenAgent.primaryActionLabel"
                      :title="$store.onscreenAgent.primaryActionLabel"
                      @click="$store.onscreenAgent.handleComposerPrimaryAction()"
                    >
                      <x-icon x-text="$store.onscreenAgent.primaryActionIcon"></x-icon>
                    </button>
                    <button
                      x-show="$store.onscreenAgent.isFullMode"
                      type="button"
                      class="onscreen-agent-inline-button onscreen-agent-attach-button"
                      :disabled="$store.onscreenAgent.isAttachmentPickerDisabled"
                      @click="$store.onscreenAgent.openAttachmentPicker()"
                      aria-label="Attach files"
                      title="Attach files"
                    >
                      <x-icon>attach_file</x-icon>
                    </button>
                    <button
                      x-show="$store.onscreenAgent.isCompactMode"
                      type="button"
                      class="onscreen-agent-inline-button onscreen-agent-menu-button"
                      :aria-expanded="String($store.onscreenAgent.isComposerActionMenuOpen)"
                      aria-controls="onscreen-agent-composer-menu"
                      aria-haspopup="menu"
                      @click="$store.onscreenAgent.toggleComposerActionMenu($event)"
                      aria-label="Open chat actions"
                      title="Open chat actions"
                    >
                      <x-icon>more_horiz</x-icon>
                    </button>
                  </div>
                </form>

                <template x-if="$store.onscreenAgent.draftAttachments.length">
                  <div class="composer-attachments" aria-label="Selected attachments">
                    <template x-for="attachment in $store.onscreenAgent.draftAttachments" :key="attachment.id">
                      <button
                        type="button"
                        class="composer-attachment"
                        @click="$store.onscreenAgent.removeDraftAttachment(attachment.id)"
                        :title="`Remove ${attachment.name}`"
                      >
                        <span class="composer-attachment-name" x-text="attachment.name"></span>
                        <x-icon>close</x-icon>
                      </button>
                    </template>
                  </div>
                </template>

                <div
                  class="onscreen-agent-footer"
                  x-show="$store.onscreenAgent.isFullMode"
                >
                  <button
                    type="button"
                    class="onscreen-agent-footer-icon"
                    @click="$store.onscreenAgent.showCompactMode()"
                    aria-label="Switch to compact chat mode"
                    title="Switch to compact chat mode"
                  >
                    <x-icon>close_fullscreen</x-icon>
                  </button>
                  <button
                    type="button"
                    class="chat-option onscreen-agent-llm-button"
                    @click="$store.onscreenAgent.openSettingsDialog()"
                    aria-label="Open chat settings"
                    title="Open chat settings"
                  >
                    <span class="chat-option-value" x-text="$store.onscreenAgent.llmSummary"></span>
                  </button>
                  <div class="onscreen-agent-footer-meta">
                    <span class="onscreen-agent-token-count" x-text="$store.onscreenAgent.historyTokenSummary"></span>
                    <button
                      type="button"
                      class="onscreen-agent-footer-icon"
                      :class="{ 'is-active': $store.onscreenAgent.isCompactingHistory }"
                      :disabled="$store.onscreenAgent.isCompactDisabled"
                      @click="$store.onscreenAgent.handleCompactClick()"
                      aria-label="Compact context window"
                      title="Compact context window"
                    >
                      <x-icon x-text="$store.onscreenAgent.compactButtonIcon"></x-icon>
                    </button>
                    <button
                      type="button"
                      class="onscreen-agent-footer-icon"
                      @click="$store.onscreenAgent.openPromptHistoryDialog()"
                      aria-label="Show context window"
                      title="Show context window"
                    >
                      <x-icon>notes</x-icon>
                    </button>
                    <button
                      type="button"
                      class="onscreen-agent-footer-icon danger"
                      :disabled="$store.onscreenAgent.isClearDisabled"
                      @click="$store.onscreenAgent.handleClearClick()"
                      aria-label="Reset chat"
                      title="Reset chat"
                    >
                      <x-icon>restart_alt</x-icon>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <template x-teleport="body">
            <div class="space-popover-layer onscreen-agent-popover-layer" x-show="$store.onscreenAgent.isComposerActionMenuOpen" x-cloak>
              <div
                id="onscreen-agent-composer-menu"
                class="space-popover-panel onscreen-agent-action-menu"
                x-ref="actionMenu"
                x-show="$store.onscreenAgent.isComposerActionMenuOpen"
                :style="$store.onscreenAgent.composerActionMenuStyle"
                @click.outside="$store.onscreenAgent.closeComposerActionMenu()"
                @keydown.escape.window="$store.onscreenAgent.closeComposerActionMenu()"
              >
                <template x-for="action in $store.onscreenAgent.composerActionMenuActions" :key="action.id">
                  <button
                    type="button"
                    class="space-popover-action"
                    :class="{ 'is-danger': action.danger }"
                    :disabled="Boolean(action.disabled)"
                    @click="$store.onscreenAgent.submitComposerActionMenuAction(action.id)"
                  >
                    <x-icon x-text="action.icon"></x-icon>
                    <span class="space-popover-action-label" x-text="action.label"></span>
                  </button>
                </template>
              </div>
            </div>
          </template>

          <template x-teleport="body">
            <div class="space-dialog-layer">
              <dialog
                id="onscreen-agent-settings-dialog"
                class="chat-dialog"
                x-ref="settingsDialog"
                @cancel.prevent="$store.onscreenAgent.closeSettingsDialog()"
              >
                <form method="dialog" class="dialog-card dialog-card-shell" @submit.prevent="$store.onscreenAgent.saveSettingsFromDialog()">
                  <header class="dialog-header">
                    <div>
                      <p class="page-eyebrow">Settings</p>
                      <h2>Model, credentials, params, and instructions</h2>
                    </div>
                  </header>
                  <div class="dialog-scroll-body">
                    <!-- Theme selector -->
                    <label class="field">
                      <span>Theme</span>
                      <div class="theme-select-wrap">
                        <template x-for="theme in $store.onscreenAgent.themes" :key="theme.id">
                          <button
                            type="button"
                            class="theme-option"
                            :class="{ 'is-active': $store.onscreenAgent.settingsDraft.theme === theme.id }"
                            x-on:click="$store.onscreenAgent.setTheme(theme.id)"
                            :title="theme.description"
                          >
                            <span class="theme-option-icon" x-text="theme.icon"></span>
                            <span class="theme-option-label" x-text="theme.label"></span>
                            <span
                              class="creator-edit-button"
                              x-show="$store.onscreenAgent.isCustomTheme(theme.id)"
                              x-on:click.stop="$store.onscreenAgent.openCreatorDialog('theme', theme.id)"
                              title="Edit this theme"
                            >
                              <x-icon>more_vert</x-icon>
                            </span>
                          </button>
                        </template>
                        <button
                          type="button"
                          class="creator-open-button"
                          x-on:click="$store.onscreenAgent.openCreatorDialog('theme')"
                          title="Create a custom theme"
                        >
                          <x-icon>add</x-icon>
                          <span>Create</span>
                        </button>
                      </div>
                    </label>
                    <!-- Character selector -->
                    <label class="field">
                      <span>Character</span>
                      <div class="character-select-wrap">
                        <template x-for="character in $store.onscreenAgent.characters" :key="character.id">
                          <button
                            type="button"
                            class="character-option"
                            :class="{ 'is-active': $store.onscreenAgent.settingsDraft.characterId === character.id }"
                            x-on:click="$store.onscreenAgent.setCharacter(character.id)"
                            :title="character.description"
                          >
                            <img class="character-option-avatar" :src="character.avatar" :alt="character.name" x-show="character.avatar" />
                            <span class="character-option-emoji" x-text="character.emoji" x-show="!character.avatar"></span>
                            <span class="character-option-label" x-text="character.name"></span>
                            <span
                              class="creator-edit-button"
                              x-show="$store.onscreenAgent.isCustomCharacter(character.id)"
                              x-on:click.stop="$store.onscreenAgent.openCreatorDialog('character', character.id)"
                              title="Edit this character"
                            >
                              <x-icon>more_vert</x-icon>
                            </span>
                          </button>
                        </template>
                        <button
                          type="button"
                          class="creator-open-button"
                          x-on:click="$store.onscreenAgent.openCreatorDialog('character')"
                          title="Create a custom character"
                        >
                          <x-icon>add</x-icon>
                          <span>Create</span>
                        </button>
                      </div>
                    </label>
                    <div class="dialog-segmented-control onscreen-agent-provider-switch" role="tablist" aria-label="LLM provider">
                      <button
                        type="button"
                        class="secondary-button dialog-segmented-button"
                        :class="{ 'is-active': $store.onscreenAgent.isSettingsDraftUsingApiProvider }"
                        @click="$store.onscreenAgent.setSettingsProvider('api')"
                      >
                        <span>API</span>
                      </button>
                      <button
                        type="button"
                        class="secondary-button dialog-segmented-button"
                        :class="{ 'is-active': $store.onscreenAgent.isSettingsDraftUsingLocalProvider }"
                        @click="$store.onscreenAgent.setSettingsProvider('local')"
                      >
                        <span>Local</span>
                      </button>
                    </div>
                    <div x-show="$store.onscreenAgent.isSettingsDraftUsingApiProvider" x-cloak>
                      <label class="field">
                        <span>Provider API Endpoint URL</span>
                        <input type="url" x-model="$store.onscreenAgent.settingsDraft.apiEndpoint" />
                      </label>
                      <label class="field">
                        <span>Model</span>
                        <div class="model-select-wrap">
                          <select
                            class="model-select"
                            x-model="$store.onscreenAgent.settingsDraft.model"
                            x-on:change="$store.onscreenAgent.onModelSelectChange($event)"
                          >
                            <template x-for="group in $store.onscreenAgent.modelGroups" :key="group">
                              <optgroup :label="group">
                                <template x-for="model in $store.onscreenAgent.modelsByGroup(group)" :key="model.id">
                                  <option :value="model.id" x-text="model.label" :selected="$store.onscreenAgent.settingsDraft.model === model.id"></option>
                                </template>
                              </optgroup>
                            </template>
                          </select>
                          <template x-if="$store.onscreenAgent.isCustomModelSelected">
                            <input
                              type="text"
                              class="model-custom-input"
                              placeholder="Enter custom model ID, e.g. org/model-name"
                              x-model="$store.onscreenAgent.settingsDraft.model"
                              x-on:input="$store.onscreenAgent.onCustomModelInput($event)"
                            />
                          </template>
                        </div>
                        <p class="field-note" x-show="$store.onscreenAgent.settingsDraftModelInfo" x-text="$store.onscreenAgent.settingsDraftModelInfo.description"></p>
                      </label>
                      <label class="field">
                        <span>API Key</span>
                        <input type="password" x-model="$store.onscreenAgent.settingsDraft.apiKey" />
                      </label>
                    </div>
                    <div x-show="$store.onscreenAgent.isSettingsDraftUsingLocalProvider" x-cloak class="onscreen-agent-local-settings">
                      <div class="onscreen-agent-local-provider-panel">
                        <x-component path="/mod/_core/huggingface/config-sidebar.html" mode="onscreen"></x-component>
                      </div>
                    </div>
                    <label class="field">
                      <span>Max Tokens</span>
                      <input type="number" min="1" step="1" inputmode="numeric" x-model="$store.onscreenAgent.settingsDraft.maxTokens" />
                      <p class="field-note">
                        Shared across both provider modes. Default <code>120000</code>. When prompt history exceeds this, compaction runs automatically before the next send.
                      </p>
                    </label>
                    <div class="field prompt-budget-field">
                      <span>Prompt Budget</span>
                      <div class="prompt-budget-preview" aria-hidden="true">
                        <template x-for="segment in $store.onscreenAgent.settingsDraftPromptBudgetSegments" :key="segment.key">
                          <span
                            class="prompt-budget-segment"
                            :class="segment.colorClass"
                            :style="`width:${segment.value}%`"
                          ></span>
                        </template>
                      </div>
                      <div class="prompt-budget-grid">
                        <label class="prompt-budget-control">
                          <span>System <strong x-text="`${$store.onscreenAgent.settingsDraftPromptBudgetRatios.system}%`"></strong></span>
                          <input
                            type="range"
                            min="0"
                            max="100"
                            step="1"
                            :value="$store.onscreenAgent.settingsDraftPromptBudgetRatios.system"
                            @input="$store.onscreenAgent.setSettingsPromptBudgetRatio('system', $event.target.value)"
                          />
                        </label>
                        <label class="prompt-budget-control">
                          <span>History <strong x-text="`${$store.onscreenAgent.settingsDraftPromptBudgetRatios.history}%`"></strong></span>
                          <input
                            type="range"
                            min="0"
                            max="100"
                            step="1"
                            :value="$store.onscreenAgent.settingsDraftPromptBudgetRatios.history"
                            @input="$store.onscreenAgent.setSettingsPromptBudgetRatio('history', $event.target.value)"
                          />
                        </label>
                        <label class="prompt-budget-control">
                          <span>Transient <strong x-text="`${$store.onscreenAgent.settingsDraftPromptBudgetRatios.transient}%`"></strong></span>
                          <input
                            type="range"
                            min="0"
                            max="100"
                            step="1"
                            :value="$store.onscreenAgent.settingsDraftPromptBudgetRatios.transient"
                            @input="$store.onscreenAgent.setSettingsPromptBudgetRatio('transient', $event.target.value)"
                          />
                        </label>
                        <label class="prompt-budget-control prompt-budget-control-single">
                          <span>Single History Message <strong x-text="`${$store.onscreenAgent.settingsDraftPromptBudgetRatios.singleMessage}%`"></strong></span>
                          <input
                            type="range"
                            min="0"
                            max="100"
                            step="1"
                            :value="$store.onscreenAgent.settingsDraftPromptBudgetRatios.singleMessage"
                            @input="$store.onscreenAgent.setSettingsSingleMessagePromptBudgetRatio($event.target.value)"
                          />
                        </label>
                      </div>
                      <p class="field-note">
                        System, history, and transient rebalance to 100% of <code>max tokens</code>. Single history message is a percentage of the history budget.
                      </p>
                    </div>
                    <label class="field">
                      <span>Params</span>
                      <textarea
                        rows="6"
                        spellcheck="false"
                        placeholder="temperature:0.2"
                        x-model="$store.onscreenAgent.settingsDraft.paramsText"
                      ></textarea>
                      <p class="field-note">
                        YAML format. Passed through to the active provider. Example: <code>temperature:0.2</code>
                      </p>
                    </label>
                    <label class="field">
                      <span>Custom Instructions</span>
                      <textarea
                        rows="8"
                        x-model="$store.onscreenAgent.systemPromptDraft"
                      ></textarea>
                      <p class="field-note">
                        Appended after the fixed onscreen agent system prompt. Clear this field to use the default prompt only.
                      </p>
                    </label>
                    <p class="dialog-note">
                      These values and custom instructions are stored in <code>~/conf/onscreen-agent.yaml</code>.
                    </p>
                  </div>
                  <div class="dialog-actions">
                    <button type="button" class="secondary-button" @click="$store.onscreenAgent.resetSettingsDraftToDefaults()">
                      Defaults
                    </button>
                    <button type="button" class="secondary-button" @click="$store.onscreenAgent.closeSettingsDialog()">Cancel</button>
                    <button type="submit" class="confirm-button">Save Settings</button>
                  </div>
                </form>
              </dialog>

              <dialog
                id="onscreen-agent-raw-dialog"
                class="chat-dialog"
                x-ref="rawDialog"
                @cancel.prevent="$store.onscreenAgent.closeRawDialog()"
              >
                <div class="dialog-card dialog-card-raw">
                  <header class="dialog-header">
                    <div>
                      <p class="page-eyebrow">LLM Output</p>
                      <h2 x-text="$store.onscreenAgent.rawOutputTitle"></h2>
                    </div>
                  </header>
                  <div class="raw-output-frame">
                    <pre class="raw-output" x-text="$store.onscreenAgent.rawOutputContent || '[No raw output available]'"></pre>
                  </div>
                  <div class="dialog-actions">
                    <button type="button" class="secondary-button" @click="$store.onscreenAgent.closeRawDialog()">Close</button>
                  </div>
                </div>
              </dialog>

              <dialog
                id="onscreen-agent-history-dialog"
                class="chat-dialog"
                x-ref="historyDialog"
                @cancel.prevent="$store.onscreenAgent.closePromptHistoryDialog()"
              >
                <div class="dialog-card dialog-card-raw dialog-card-shell">
                  <header class="dialog-header">
                    <div>
                      <p class="page-eyebrow">Context Window</p>
                      <h2 x-text="$store.onscreenAgent.promptHistoryTitle"></h2>
                    </div>
                    <div class="dialog-header-actions">
                      <div class="dialog-segmented-control" role="tablist" aria-label="Prompt history mode">
                        <button
                          type="button"
                          class="secondary-button dialog-segmented-button"
                          :class="{ 'is-active': $store.onscreenAgent.promptHistoryMode === 'text' }"
                          @click="$store.onscreenAgent.setPromptHistoryMode('text')"
                        >
                          <x-icon>notes</x-icon>
                          <span>Text</span>
                        </button>
                        <button
                          type="button"
                          class="secondary-button dialog-segmented-button"
                          :class="{ 'is-active': $store.onscreenAgent.promptHistoryMode === 'json' }"
                          @click="$store.onscreenAgent.setPromptHistoryMode('json')"
                        >
                          <x-icon>data_object</x-icon>
                          <span>JSON</span>
                        </button>
                      </div>
                    </div>
                  </header>
                  <div class="raw-output-frame dialog-scroll-frame" data-prompt-history-frame>
                    <template x-if="$store.onscreenAgent.promptHistoryMode === 'text'">
                      <div class="prompt-history-list">
                        <template x-if="!$store.onscreenAgent.promptHistorySections.length">
                          <pre class="raw-output"></pre>
                        </template>
                        <template x-for="(section, index) in $store.onscreenAgent.promptHistorySections" :key="`${section.role}-${index}`">
                          <section
                            class="prompt-history-section"
                            :class="{ 'is-target': section.isTarget }"
                            :data-prompt-history-message-index="section.messageIndex"
                          >
                            <div class="prompt-history-role" x-text="`${section.role} (${section.tokenCountLabel}):`"></div>
                            <pre class="prompt-history-body" x-text="section.content"></pre>
                          </section>
                        </template>
                      </div>
                    </template>
                    <template x-if="$store.onscreenAgent.promptHistoryMode === 'json'">
                      <pre
                        class="raw-output"
                        data-prompt-history-json-output
                        x-text="$store.onscreenAgent.promptHistoryContent || '[]'"
                      ></pre>
                    </template>
                  </div>
                  <div class="dialog-actions dialog-actions-split prompt-history-actions">
                    <div class="dialog-actions-group prompt-history-actions-left">
                      <button
                        type="button"
                        class="secondary-button dialog-action-button-fixed prompt-history-action-button"
                        title="Jump to first real user message"
                        aria-label="Jump to first real user message"
                        :disabled="!$store.onscreenAgent.hasPromptHistoryUserMessages"
                        @click="$store.onscreenAgent.jumpToFirstPromptHistoryUserMessage()"
                      >
                        <x-icon>person</x-icon>
                        <span>1st</span>
                      </button>
                      <button
                        type="button"
                        class="secondary-button dialog-action-button-fixed prompt-history-action-button"
                        title="Jump to previous real user message"
                        aria-label="Jump to previous real user message"
                        :disabled="!$store.onscreenAgent.canJumpToPreviousPromptHistoryUserMessage"
                        @click="$store.onscreenAgent.jumpToPreviousPromptHistoryUserMessage()"
                      >
                        <x-icon>keyboard_arrow_up</x-icon>
                      </button>
                      <button
                        type="button"
                        class="secondary-button dialog-action-button-fixed prompt-history-action-button"
                        title="Jump to next real user message"
                        aria-label="Jump to next real user message"
                        :disabled="!$store.onscreenAgent.canJumpToNextPromptHistoryUserMessage"
                        @click="$store.onscreenAgent.jumpToNextPromptHistoryUserMessage()"
                      >
                        <x-icon>keyboard_arrow_down</x-icon>
                      </button>
                    </div>
                    <div class="dialog-actions-group dialog-actions-group-end prompt-history-actions-right">
                      <button
                        type="button"
                        class="secondary-button dialog-action-button-fixed prompt-history-action-button"
                        title="Copy system prompt"
                        aria-label="Copy system prompt"
                        @click="$store.onscreenAgent.copyPromptHistorySystemPrompt()"
                      >
                        <x-icon>content_copy</x-icon>
                        <span>System</span>
                      </button>
                      <button
                        type="button"
                        class="secondary-button dialog-action-button-fixed prompt-history-action-button"
                        title="Copy history"
                        aria-label="Copy history"
                        @click="$store.onscreenAgent.copyPromptHistoryHistory()"
                      >
                        <x-icon>content_copy</x-icon>
                        <span>History</span>
                      </button>
                      <button
                        type="button"
                        class="secondary-button dialog-action-button-fixed prompt-history-action-button"
                        title="Copy all"
                        aria-label="Copy all"
                        @click="$store.onscreenAgent.copyPromptHistoryAll()"
                      >
                        <x-icon>content_copy</x-icon>
                        <span>All</span>
                      </button>
                      <button
                        type="button"
                        class="secondary-button dialog-action-button-fixed prompt-history-action-button"
                        @click="$store.onscreenAgent.closePromptHistoryDialog()"
                      >
                        <span>Close</span>
                      </button>
                    </div>
                  </div>
                </div>
              </dialog>
            </div>
          </template>
        </section>
      </template>

      <!-- ─── Creator Dialog ─────────────────────────────────────────── -->
      <dialog
        class="creator-dialog"
        x-ref="creatorDialog"
        x-show="$store.onscreenAgent.isCreatorDialogOpen"
        @cancel.prevent="$store.onscreenAgent.closeCreatorDialog()"
        x-cloak
      >
        <form method="dialog" class="dialog-card dialog-card-shell" @submit.prevent>
          <header class="dialog-header">
            <div>
              <p class="page-eyebrow" x-text="$store.onscreenAgent.creatorDialogMode === 'theme' ? 'Theme Creator' : 'Character Creator'"></p>
              <h2 x-text="$store.onscreenAgent.creatorDialogMode === 'theme' ? 'Design your theme' : 'Design your character'"></h2>
            </div>
            <button type="button" class="dialog-close-button" x-on:click="$store.onscreenAgent.closeCreatorDialog()">&times;</button>
          </header>
          <div class="dialog-scroll-body">

            <!-- THEME CREATOR -->
            <div x-show="$store.onscreenAgent.creatorDialogMode === 'theme'" x-cloak>
              <label class="field">
                <span>Theme ID</span>
                <input type="text" x-model="$store.onscreenAgent.creatorDraftTheme.id" placeholder="custom-my-theme" />
              </label>
              <label class="field">
                <span>Display Name</span>
                <input type="text" x-model="$store.onscreenAgent.creatorDraftTheme.label" placeholder="My Theme" maxlength="40" />
              </label>
              <label class="field">
                <span>Icon (emoji)</span>
                <input type="text" x-model="$store.onscreenAgent.creatorDraftTheme.icon" placeholder="🎨" />
              </label>
              <label class="field">
                <span>Description</span>
                <input type="text" x-model="$store.onscreenAgent.creatorDraftTheme.description" placeholder="A short description" />
              </label>
              <label class="field">
                <span>Base Palette</span>
                <div class="creator-base-toggle">
                  <button type="button"
                    :class="{ 'is-active': $store.onscreenAgent.creatorDraftTheme.base === 'dark' }"
                    x-on:click="$store.onscreenAgent.creatorDraftTheme.base = 'dark'">Dark</button>
                  <button type="button"
                    :class="{ 'is-active': $store.onscreenAgent.creatorDraftTheme.base === 'light' }"
                    x-on:click="$store.onscreenAgent.creatorDraftTheme.base = 'light'">Light</button>
                </div>
              </label>
              <details class="creator-color-section">
                <summary><h3>Color Overrides</h3></summary>
                <template x-for="colorKey in $store.onscreenAgent.themeColorKeys" :key="colorKey">
                  <label class="field creator-color-field">
                    <span x-text="colorKey"></span>
                    <div class="creator-color-input-group">
                      <input type="color"
                        :value="$store.onscreenAgent.creatorDraftTheme.colors[colorKey] || $store.onscreenAgent.getBaseColor($store.onscreenAgent.creatorDraftTheme.base, colorKey)"
                        x-on:input="$store.onscreenAgent.creatorDraftTheme.colors[colorKey] = $el.value"
                      />
                      <input type="text"
                        :value="$store.onscreenAgent.creatorDraftTheme.colors[colorKey] || ''"
                        x-on:change="$store.onscreenAgent.creatorDraftTheme.colors[colorKey] = $el.value"
                        placeholder="inherit"
                        class="creator-color-text"
                      />
                      <button type="button" class="secondary-button"
                        x-on:click="delete $store.onscreenAgent.creatorDraftTheme.colors[colorKey]">Reset</button>
                    </div>
                  </label>
                </template>
              </details>
              <div class="creator-preview">
                <h3>Live Preview</h3>
                <div class="creator-preview-box" :style="$store.onscreenAgent.creatorThemeColorPreviewStyle()">
                  <div class="creator-preview-surface">
                    <span class="creator-preview-text">Sample text preview</span>
                    <button type="button" class="secondary-button">Button</button>
                    <input type="text" placeholder="Input field" class="creator-preview-input" />
                  </div>
                </div>
              </div>
            </div>

            <!-- CHARACTER CREATOR -->
            <div x-show="$store.onscreenAgent.creatorDialogMode === 'character'" x-cloak>
              <label class="field">
                <span>Character ID</span>
                <input type="text" x-model="$store.onscreenAgent.creatorDraftCharacter.id" placeholder="custom-my-character" />
              </label>
              <label class="field">
                <span>Display Name</span>
                <input type="text" x-model="$store.onscreenAgent.creatorDraftCharacter.name" placeholder="My Character" maxlength="30" />
              </label>
              <label class="field">
                <span>Emoji</span>
                <input type="text" x-model="$store.onscreenAgent.creatorDraftCharacter.emoji" placeholder="🙂" />
              </label>
              <label class="field">
                <span>Description</span>
                <input type="text" x-model="$store.onscreenAgent.creatorDraftCharacter.description" placeholder="A short description" maxlength="80" />
              </label>
              <label class="field">
                <span>Avatar</span>
                <div class="creator-avatar-field">
                  <div class="creator-avatar-preview">
                    <img x-show="$store.onscreenAgent.creatorDraftCharacter.avatar"
                      :src="$store.onscreenAgent.creatorDraftCharacter.avatar" alt="avatar" />
                    <span x-show="!$store.onscreenAgent.creatorDraftCharacter.avatar"
                      class="creator-avatar-emoji"
                      x-text="$store.onscreenAgent.creatorDraftCharacter.emoji"></span>
                  </div>
                  <input type="file" accept="image/*" class="creator-avatar-input"
                    x-on:change="$store.onscreenAgent.creatorHandleAvatarUpload($event)" />
                  <button type="button" class="secondary-button"
                    x-on:click="$store.onscreenAgent.creatorDraftCharacter.avatar = ''">Clear</button>
                </div>
              </label>
              <label class="field">
                <span>Avatar URL (optional)</span>
                <input type="text" x-model="$store.onscreenAgent.creatorDraftCharacter.avatar" placeholder="https://..." />
              </label>
              <label class="field">
                <span>System Prompt Prefix</span>
                <textarea x-model="$store.onscreenAgent.creatorDraftCharacter.systemPromptPrefix"
                  placeholder="You are..." rows="4" maxlength="2000"></textarea>
              </label>
              <div class="creator-preview">
                <h3>Live Preview</h3>
                <div class="creator-preview-character-card">
                  <div class="character-option">
                    <img class="character-option-avatar"
                      :src="$store.onscreenAgent.creatorDraftCharacter.avatar"
                      x-show="$store.onscreenAgent.creatorDraftCharacter.avatar" />
                    <span class="character-option-emoji"
                      x-text="$store.onscreenAgent.creatorDraftCharacter.emoji"
                      x-show="!$store.onscreenAgent.creatorDraftCharacter.avatar"></span>
                    <span class="character-option-label"
                      x-text="$store.onscreenAgent.creatorDraftCharacter.name || 'Character Name'"></span>
                  </div>
                  <p class="creator-preview-description"
                    x-text="$store.onscreenAgent.creatorDraftCharacter.description || 'Character description'"></p>
                </div>
              </div>
            </div>

          </div>
          <footer class="dialog-footer">
            <button type="button" class="secondary-button"
              x-show="$store.onscreenAgent.creatorEditingId"
              x-on:click="$store.onscreenAgent.creatorDeleteCurrentItem()"
              style="color: var(--color-status-danger)">
              Delete
            </button>
            <div style="flex:1"></div>
            <button type="button" class="secondary-button" x-on:click="$store.onscreenAgent.closeCreatorDialog()">Cancel</button>
            <button type="button" class="primary-button"
              x-text="$store.onscreenAgent.creatorDialogMode === 'theme'
                ? ($store.onscreenAgent.creatorEditingId ? 'Update Theme' : 'Save Theme')
                : ($store.onscreenAgent.creatorEditingId ? 'Update Character' : 'Save Character')"
              x-on:click="$store.onscreenAgent.creatorDialogMode === 'theme'
                ? $store.onscreenAgent.creatorSaveTheme()
                : $store.onscreenAgent.creatorSaveCharacter()"
            ></button>
          </footer>
        </form>
      </dialog>

    </div>
  </body>
</html>
